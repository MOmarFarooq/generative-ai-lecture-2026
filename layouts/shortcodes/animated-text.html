<div class="text-wrapper" style="margin: 20px 0; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 12px 20px;">
        {{ with .Get "title" }}
            <span style="font-weight: bold;">{{ . }}</span>
        {{ end }}
        <div>
            <button class="animate-btn" data-type="text" style="padding: 4px 12px; margin-right: 8px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">▶ Animate</button>
            <button class="collapse-btn" data-type="text" style="padding: 4px 12px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">− Collapse</button>
        </div>
    </div>
    <div class="content-area" style="transition: max-height 0.3s ease; overflow: hidden; max-height: 1000px;">
        <div class="text-display" style="padding: 20px;">
            {{ .Inner | markdownify }}
        </div>
    </div>
</div>
